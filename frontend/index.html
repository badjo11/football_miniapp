<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Football App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #1c2733);
    --text: var(--tg-theme-text-color, #e1e8f0);
    --hint: var(--tg-theme-hint-color, #7a8fa0);
    --link: var(--tg-theme-link-color, #6ab3f3);
    --btn: var(--tg-theme-button-color, #3a95d5);
    --btn-text: var(--tg-theme-button-text-color, #fff);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #17212b);
    --section-bg: var(--tg-theme-section-bg-color, #232e3c);
    --accent: #4cc474;
    --warn: #f5c542;
    --danger: #e06c75; 
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding-bottom: 72px;
    -webkit-font-smoothing: antialiased;
  }
  .nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--secondary-bg);
    border-top: 1px solid rgba(255,255,255,0.06);
    display: flex; z-index: 100;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; gap: 2px;
    padding: 8px 0; font-size: 11px; color: var(--hint);
    cursor: pointer; transition: color 0.15s;
    border: none; background: none;
  }
  .nav-item.active { color: var(--link); }
  .nav-item svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .screen { display: none; padding: 16px; animation: fadeIn 0.2s ease; }
  .screen.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; } }
  .card { background: var(--section-bg); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .card-title { font-size: 16px; font-weight: 600; }
  .badge { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 10px; }
  .badge-s { background: rgba(245,197,66,0.15); color: var(--warn); }
  .badge-a { background: rgba(76,196,116,0.15); color: var(--accent); }
  .badge-b { background: rgba(106,179,243,0.15); color: var(--link); }
  .badge-c { background: rgba(255,255,255,0.08); color: var(--hint); }
  .player-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .player-row:last-child { border-bottom: none; }
  .player-avatar {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 12px; flex-shrink: 0;
  }
  .player-info { flex: 1; min-width: 0; }
  .player-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-username { font-size: 12px; color: var(--hint); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 12px 20px; border-radius: 12px;
    font-size: 15px; font-weight: 600; border: none; cursor: pointer;
    width: 100%; transition: transform 0.1s, opacity 0.15s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--btn); color: var(--btn-text); }
  .btn-danger { background: rgba(224,108,117,0.15); color: var(--danger); }
  .btn-secondary { background: rgba(255,255,255,0.06); color: var(--text); }
  .btn-sm { padding: 8px 14px; font-size: 13px; width: auto; border-radius: 8px; }
  .btn:disabled { opacity: 0.4; pointer-events: none; }
  .btn-row { display: flex; gap: 8px; margin-top: 12px; }
  .btn-row .btn { flex: 1; }
  .section-title {
    font-size: 13px; font-weight: 600; color: var(--hint);
    text-transform: uppercase; letter-spacing: 0.5px;
    margin: 20px 0 10px; padding-left: 4px;
  }
  .section-title:first-child { margin-top: 0; }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--hint); }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; line-height: 1.5; }
  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 13px; color: var(--hint); margin-bottom: 6px; display: block; }
  .form-input {
    width: 100%; padding: 10px 14px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; color: var(--text);
    font-size: 15px; outline: none;
  }
  .form-input:focus { border-color: var(--link); }
  select.form-input { -webkit-appearance: none; }
  .rating-edit { display: flex; align-items: center; gap: 8px; }
  .rating-edit input[type="range"] { flex: 1; accent-color: var(--btn); }
  .rating-value { font-size: 16px; font-weight: 600; min-width: 36px; text-align: center; }
  .loading { text-align: center; padding: 40px; color: var(--hint); }
  .spinner {
    width: 28px; height: 28px; border: 2px solid rgba(255,255,255,0.1);
    border-top-color: var(--link); border-radius: 50%;
    animation: spin 0.6s linear infinite; margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Stats table */
  .stats-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .stats-table th {
    text-align: left; padding: 8px 6px; color: var(--hint);
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .stats-table td { padding: 8px 6px; border-bottom: 1px solid rgba(255,255,255,0.04); }
  .stats-table tr:last-child td { border-bottom: none; }
  .stats-table .num { text-align: center; }
  .stat-w { color: var(--accent); font-weight: 600; }
  .stat-d { color: var(--warn); font-weight: 600; }
  .stat-l { color: var(--danger); font-weight: 600; }

  /* Match card */
  .match-card {
    background: var(--section-bg); border-radius: 12px;
    padding: 14px; margin-bottom: 10px;
  }
  .match-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .match-teams { font-size: 15px; font-weight: 600; }
  .match-result { font-size: 13px; padding: 3px 8px; border-radius: 8px; }
  .match-result.win-a { background: rgba(76,196,116,0.15); color: var(--accent); }
  .match-result.win-b { background: rgba(106,179,243,0.15); color: var(--link); }
  .match-result.draw { background: rgba(245,197,66,0.15); color: var(--warn); }
  .match-result.pending { background: rgba(255,255,255,0.06); color: var(--hint); }
  .match-goals { font-size: 14px; color: var(--text); margin-top: 8px; }
  .match-goal-item { padding: 6px 0; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(255,255,255,0.04); }
  .match-goal-item:last-child { border-bottom: none; }

  /* Team color indicators */
  .team-color {
    display: inline-block; width: 10px; height: 10px;
    border-radius: 50%; margin-right: 6px;
  }
  .team-1 { background: #6ab3f3; }
  .team-2 { background: #4cc474; }
  .team-3 { background: #f5c542; }
  .team-4 { background: #e06c75; }

  /* Chip selectors */
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip {
    padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 500;
    border: 1px solid rgba(255,255,255,0.1); background: none;
    color: var(--text); cursor: pointer; transition: all 0.15s;
  }
  .chip.active { background: var(--btn); color: var(--btn-text); border-color: var(--btn); }
  .chip:active { transform: scale(0.95); }

  /* Player select button */
  .player-select-btn {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 10px 12px; margin-bottom: 6px;
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px; color: var(--text); cursor: pointer;
    font-size: 14px; text-align: left; transition: background 0.15s;
  }
  .player-select-btn:active { background: rgba(255,255,255,0.08); }
  .player-select-btn .avatar-sm {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 10px; flex-shrink: 0;
  }

  /* Game item in history */
  .game-item {
    background: var(--section-bg); border-radius: 12px;
    padding: 14px; margin-bottom: 10px; cursor: pointer;
    transition: background 0.15s;
  }
  .game-item:active { background: rgba(255,255,255,0.08); }
  .game-item-header { display: flex; justify-content: space-between; align-items: center; }
  .game-item-date { font-size: 15px; font-weight: 600; }
  .game-item-meta { font-size: 12px; color: var(--hint); margin-top: 4px; }
  .game-status { font-size: 11px; padding: 2px 8px; border-radius: 8px; font-weight: 600; }
  .game-status.active { background: rgba(76,196,116,0.15); color: var(--accent); }
  .game-status.closed { background: rgba(255,255,255,0.06); color: var(--hint); }

  /* Delete btn */
  .del-btn {
    background: none; border: none; color: var(--danger);
    cursor: pointer; font-size: 18px; padding: 4px 8px;
    opacity: 0.7; transition: opacity 0.15s; flex-shrink: 0;
  }
  .del-btn:hover { opacity: 1; }

  /* Tab bar inside admin */
  .tab-bar { display: flex; gap: 0; margin-bottom: 16px; border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); }
  .tab-btn {
    flex: 1; padding: 10px; font-size: 13px; font-weight: 600;
    background: none; border: none; color: var(--hint);
    cursor: pointer; transition: all 0.15s; text-align: center;
  }
  .tab-btn.active { background: var(--btn); color: var(--btn-text); }

  /* Goal form area */
  .goal-form {
    margin-top: 12px; padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .goal-form-label { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
  .goal-form select.form-input {
    font-size: 16px; padding: 12px 14px; margin-bottom: 10px;
  }
  .goal-form .btn-sm { padding: 12px 20px; font-size: 15px; }
</style>
</head>
<body>

<!-- STATS -->
<div id="screen-stats" class="screen active">
  <div id="stats-content"><div class="loading"><div class="spinner"></div>Loading...</div></div>
</div>

<!-- GAMES -->
<div id="screen-games" class="screen">
  <div id="games-content"><div class="loading"><div class="spinner"></div></div></div>
</div>

<!-- GAME DETAIL -->
<div id="screen-game-detail" class="screen">
  <div id="game-detail-content"></div>
</div>

<!-- ADMIN -->
<div id="screen-admin" class="screen">
  <div id="admin-content"></div>
</div>

<!-- NAV -->
<nav class="nav">
  <button class="nav-item active" onclick="showScreen('stats')">
    <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    Статистика
  </button>
  <button class="nav-item" onclick="showScreen('games')">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    Игры
  </button>
  <button class="nav-item" id="nav-admin" style="display:none" onclick="showScreen('admin')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9c.26.6.77 1.05 1.39 1.17H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    Админ
  </button>
</nav>

<script>
var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
var initData = tg ? tg.initData || "" : "";

if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor("secondary_bg_color");
}

var state = {
  player: null,
  isAdmin: false,
  allPlayers: [],
  activeGame: null,
  adminTab: "game",
  statsTab: "results"
};

// --- API ---
function api(path, method, body) {
  method = method || "GET";
  var params = new URLSearchParams(window.location.search);
  var authQuery = "";
  if (params.get("uid")) {
    authQuery = (path.indexOf("?") >= 0 ? "&" : "?") +
      "uid=" + params.get("uid") +
      "&un=" + encodeURIComponent(params.get("un") || "") +
      "&fn=" + encodeURIComponent(params.get("fn") || "") +
      "&ln=" + encodeURIComponent(params.get("ln") || "") +
      "&ts=" + params.get("ts") +
      "&sig=" + params.get("sig");
  }
  var h = { "Content-Type": "application/json" };
  if (initData) h["X-Telegram-Init-Data"] = initData;
  var opts = { method: method, headers: h };
  if (body) opts.body = JSON.stringify(body);
  return fetch("/api" + path + authQuery, opts).then(function(res) {
    if (!res.ok) {
      return res.text().then(function(t) {
        var detail = "Error " + res.status;
        try { detail = JSON.parse(t).detail || detail; } catch(e) {}
        throw new Error(detail);
      });
    }
    return res.json();
  });
}

// --- Navigation ---
function showScreen(name) {
  var screens = document.querySelectorAll(".screen");
  for (var i = 0; i < screens.length; i++) screens[i].classList.remove("active");
  var navItems = document.querySelectorAll(".nav-item");
  for (var i = 0; i < navItems.length; i++) navItems[i].classList.remove("active");
  document.getElementById("screen-" + name).classList.add("active");
  var idx = { stats: 0, games: 1, admin: 2 }[name];
  if (idx !== undefined && navItems[idx]) navItems[idx].classList.add("active");

  var loaders = { stats: loadStats, games: loadGames, admin: loadAdmin };
  if (loaders[name]) loaders[name]();
}

// --- Helpers ---
function ratingClass(r) {
  if (r >= 9) return "s";
  if (r >= 7) return "a";
  if (r >= 5) return "b";
  return "c";
}

function avatarColor(name) {
  var colors = ["#e06c75","#d19a66","#e5c07b","#98c379","#56b6c2","#61afef","#c678dd"];
  var h = 0;
  for (var i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
  return colors[Math.abs(h) % colors.length];
}

function initials(p) {
  var f = p.first_name || "";
  var l = p.last_name || "";
  return (f[0] || "") + (l[0] || "") || "?";
}

function playerName(p) {
  var parts = [];
  if (p.first_name) parts.push(p.first_name);
  if (p.last_name && p.last_name !== "(guest)") parts.push(p.last_name);
  return parts.join(" ") || p.username || "Player";
}

function teamColorClass(n) { return "team-" + n; }

function getTeamColor(n) {
  var colors = { 1: "#6ab3f3", 2: "#4cc474", 3: "#f5c542", 4: "#e06c75" };
  return colors[n] || "#888";
}

// Get team name = first name of top-rated player in team
// teamsData: {teamNum: [playerObjects]} (from API)
function getTeamNameFromPlayers(teamNum, teamsData) {
  var players = teamsData[teamNum];
  if (!players || players.length === 0) return "Team " + teamNum;
  var best = players[0];
  for (var i = 1; i < players.length; i++) {
    if (players[i].rating > best.rating) best = players[i];
  }
  return best.first_name || playerName(best);
}

// Build team names map from teamsData
function buildTeamNames(teamsData) {
  var names = {};
  var keys = Object.keys(teamsData);
  for (var i = 0; i < keys.length; i++) {
    names[keys[i]] = getTeamNameFromPlayers(keys[i], teamsData);
  }
  return names;
}

// For teamAssignment (IDs only) - build names from allPlayers
function getTeamNameFromIds(teamNum) {
  var ids = teamAssignment[teamNum];
  if (!ids || ids.length === 0) return "Team " + teamNum;
  var best = null;
  for (var i = 0; i < ids.length; i++) {
    var pl = findPlayer(ids[i]);
    if (pl && (!best || pl.rating > best.rating)) best = pl;
  }
  return best ? (best.first_name || playerName(best)) : "Team " + teamNum;
}

// --- STATS ---
var cachedStats = null;

function loadStats() {
  var el = document.getElementById("stats-content");
  api("/me").then(function(data) {
    state.player = data.player;
    state.isAdmin = data.player.is_admin;
    if (state.isAdmin) document.getElementById("nav-admin").style.display = "";
    return api("/stats");
  }).then(function(data) {
    cachedStats = data.stats;
    renderStatsView(el);
  }).catch(function(e) {
    el.innerHTML = '<div class="empty-state"><p>' + e.message + '</p></div>';
  });
}

function switchStatsTab(tab) {
  state.statsTab = tab;
  var el = document.getElementById("stats-content");
  renderStatsView(el);
}

function renderStatsView(el) {
  var stats = cachedStats;
  if (!stats || stats.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="icon">&#9917;</div><p>No players yet.</p></div>';
    return;
  }
  var tab = state.statsTab;
  var html = '<div class="tab-bar" style="margin-bottom:12px">' +
    '<button class="tab-btn ' + (tab === "results" ? "active" : "") + '" onclick="switchStatsTab(\'results\')">Results</button>' +
    '<button class="tab-btn ' + (tab === "goals" ? "active" : "") + '" onclick="switchStatsTab(\'goals\')">Goals</button>' +
    '</div>';

  if (tab === "results") {
    // Sort by points desc, then win% desc
    var sorted = stats.slice().sort(function(a, b) {
      var ptsA = a.wins * 3 + a.draws;
      var ptsB = b.wins * 3 + b.draws;
      if (ptsB !== ptsA) return ptsB - ptsA;
      var wpA = a.matches > 0 ? a.wins / a.matches : 0;
      var wpB = b.matches > 0 ? b.wins / b.matches : 0;
      return wpB - wpA;
    });

    html += '<div class="card" style="padding:10px;overflow-x:auto">' +
      '<table class="stats-table"><thead><tr>' +
      '<th>Player</th><th class="num">M</th>' +
      '<th class="num">W</th><th class="num">D</th><th class="num">L</th>' +
      '<th class="num">W%</th><th class="num">Pts</th></tr></thead><tbody>';

    for (var i = 0; i < sorted.length; i++) {
      var s = sorted[i];
      var name = playerName(s);
      var color = avatarColor(name);
      var pts = s.wins * 3 + s.draws;
      var winPct = s.matches > 0 ? Math.round((s.wins / s.matches) * 100) : 0;

      html += '<tr>' +
        '<td style="white-space:nowrap"><span class="player-avatar" style="width:26px;height:26px;font-size:10px;display:inline-flex;vertical-align:middle;background:' + color + '22;color:' + color + '">' + initials(s) + '</span> ' + name + '</td>' +
        '<td class="num">' + s.matches + '</td>' +
        '<td class="num stat-w">' + s.wins + '</td>' +
        '<td class="num stat-d">' + s.draws + '</td>' +
        '<td class="num stat-l">' + s.losses + '</td>' +
        '<td class="num">' + winPct + '%</td>' +
        '<td class="num" style="font-weight:700">' + pts + '</td>' +
        '</tr>';
    }
    html += '</tbody></table></div>';
  } else {
    // Goals tab - sorted by G+A desc
    var sorted = stats.slice().sort(function(a, b) {
      var gaA = a.goals + a.assists;
      var gaB = b.goals + b.assists;
      return gaB - gaA;
    });

    html += '<div class="card" style="padding:10px;overflow-x:auto">' +
      '<table class="stats-table"><thead><tr>' +
      '<th>Player</th>' +
      '<th class="num">G</th><th class="num">A</th><th class="num">G+A</th>' +
      '<th class="num">Avg</th></tr></thead><tbody>';

    for (var i = 0; i < sorted.length; i++) {
      var s = sorted[i];
      var name = playerName(s);
      var color = avatarColor(name);
      var ga = s.goals + s.assists;
      var avg = s.matches > 0 ? (ga / s.matches).toFixed(1) : "0.0";

      html += '<tr>' +
        '<td style="white-space:nowrap"><span class="player-avatar" style="width:26px;height:26px;font-size:10px;display:inline-flex;vertical-align:middle;background:' + color + '22;color:' + color + '">' + initials(s) + '</span> ' + name + '</td>' +
        '<td class="num">' + s.goals + '</td>' +
        '<td class="num">' + s.assists + '</td>' +
        '<td class="num" style="font-weight:700">' + ga + '</td>' +
        '<td class="num">' + avg + '</td>' +
        '</tr>';
    }
    html += '</tbody></table></div>';
  }

  el.innerHTML = html;
}

// --- GAMES ---
function loadGames() {
  var el = document.getElementById("games-content");
  api("/games").then(function(data) {
    var games = data.games;
    if (!games || games.length === 0) {
      el.innerHTML = '<div class="empty-state"><div class="icon">&#128197;</div><p>No games yet.</p></div>';
      return;
    }
    var html = '<div class="section-title">All games</div>';
    for (var i = 0; i < games.length; i++) {
      var g = games[i];
      var statusCls = g.status === "active" ? "active" : "closed";
      var statusText = g.status === "active" ? "Active" : "Closed";
      html += '<div class="game-item" style="position:relative">' +
        '<div onclick="openGameDetail(' + g.id + ')" style="cursor:pointer">' +
        '<div class="game-item-header">' +
        '<div class="game-item-date">' + g.date + '</div>' +
        '<div style="display:flex;align-items:center;gap:6px"><span class="game-status ' + statusCls + '">' + statusText + '</span>' +
        (state.isAdmin ? '<button class="del-btn" onclick="event.stopPropagation();doDeleteGame(' + g.id + ')" style="font-size:16px">x</button>' : '') +
        '</div></div>' +
        '<div class="game-item-meta">' + g.time + ' &middot; ' + g.location + '</div>' +
        '</div></div>';
    }
    el.innerHTML = html;
  }).catch(function(e) {
    el.innerHTML = '<div class="empty-state"><p>' + e.message + '</p></div>';
  });
}

function doDeleteGame(gameId) {
  if (!confirm("Delete game and all its stats?")) return;
  api("/game/" + gameId, "DELETE").then(function() {
    loadGames();
  }).catch(function(e) {});
}

function openGameDetail(gameId) {
  var screens = document.querySelectorAll(".screen");
  for (var i = 0; i < screens.length; i++) screens[i].classList.remove("active");
  document.getElementById("screen-game-detail").classList.add("active");
  loadGameDetail(gameId);
}

function loadGameDetail(gameId) {
  var el = document.getElementById("game-detail-content");
  el.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  api("/game/" + gameId).then(function(data) {
    var g = data.game;
    var teams = data.teams;
    var matches = data.matches;
    var goals = data.goals;
    var tNames = buildTeamNames(teams);

    var html = '<div style="margin-bottom:12px"><button class="btn btn-secondary btn-sm" style="width:auto" onclick="showScreen(\'games\')">&larr; Back</button></div>';
    html += '<div class="card"><div class="card-title">' + g.date + ' &middot; ' + g.time + '</div>' +
      '<div style="font-size:13px;color:var(--hint);margin-top:4px">' + g.location + '</div></div>';

    // Teams
    var teamNums = Object.keys(teams).sort();
    if (teamNums.length > 0) {
      html += '<div class="section-title">Teams</div>';
      for (var t = 0; t < teamNums.length; t++) {
        var tn = teamNums[t];
        var players = teams[tn];
        html += '<div class="card" style="border-left:3px solid;border-left-color:' + getTeamColor(tn) + '">' +
          '<div class="card-title"><span class="team-color ' + teamColorClass(tn) + '"></span>' + tNames[tn] + ' (' + players.length + ')</div>';
        for (var p = 0; p < players.length; p++) {
          var pl = players[p];
          html += '<div class="player-row">' +
            '<div class="player-avatar" style="width:30px;height:30px;font-size:11px;background:' + avatarColor(playerName(pl)) + '22;color:' + avatarColor(playerName(pl)) + '">' + initials(pl) + '</div>' +
            '<div class="player-info"><div class="player-name">' + playerName(pl) + '</div></div>' +
            '<span style="font-size:13px;color:var(--hint)">' + pl.rating.toFixed(1) + '</span></div>';
        }
        html += '</div>';
      }
    }

    // Matches
    if (matches.length > 0) {
      html += '<div class="section-title">Matches</div>';
      for (var m = 0; m < matches.length; m++) {
        var match = matches[m];
        var nameA = tNames[match.team_a] || "Team " + match.team_a;
        var nameB = tNames[match.team_b] || "Team " + match.team_b;
        var resultText = "Not played";
        var resultCls = "pending";
        if (match.result === "team_a") { resultText = nameA + " won"; resultCls = "win-a"; }
        else if (match.result === "team_b") { resultText = nameB + " won"; resultCls = "win-b"; }
        else if (match.result === "draw") { resultText = "Draw"; resultCls = "draw"; }

        html += '<div class="match-card"><div class="match-header">' +
          '<div class="match-teams"><span class="team-color ' + teamColorClass(match.team_a) + '"></span>' +
          nameA + ' vs ' + nameB +
          '<span class="team-color ' + teamColorClass(match.team_b) + '" style="margin-left:6px"></span></div>' +
          '<span class="match-result ' + resultCls + '">' + resultText + '</span></div>';

        // Goals for this match
        var matchGoals = [];
        for (var gi = 0; gi < goals.length; gi++) {
          if (goals[gi].match_id === match.id) matchGoals.push(goals[gi]);
        }
        if (matchGoals.length > 0) {
          html += '<div class="match-goals">';
          for (var gi = 0; gi < matchGoals.length; gi++) {
            var goal = matchGoals[gi];
            var scorer = ((goal.scorer_first || "") + " " + (goal.scorer_last && goal.scorer_last !== "(guest)" ? goal.scorer_last : "")).trim();
            var line = '<span style="font-size:16px">&#9917;</span> <span style="font-weight:500">' + scorer + '</span>';
            if (goal.assist_player_id) {
              var assister = ((goal.assist_first || "") + " " + (goal.assist_last && goal.assist_last !== "(guest)" ? goal.assist_last : "")).trim();
              line += ' <span style="color:var(--hint)">(assist: ' + assister + ')</span>';
            }
            html += '<div class="match-goal-item">' + line + '</div>';
          }
          html += '</div>';
        }
        html += '</div>';
      }
    }

    el.innerHTML = html;
  }).catch(function(e) {
    el.innerHTML = '<div class="empty-state"><p>' + e.message + '</p></div>';
  });
}

// --- ADMIN ---
function loadAdmin() {
  var el = document.getElementById("admin-content");
  if (!state.isAdmin) {
    el.innerHTML = '<div class="empty-state"><p>No access.</p></div>';
    return;
  }
  api("/players").then(function(data) {
    state.allPlayers = data.players;
    renderAdminTabs();
  });
}

function renderAdminTabs() {
  var el = document.getElementById("admin-content");
  var tab = state.adminTab;
  var html = '<div class="tab-bar">' +
    '<button class="tab-btn ' + (tab === "game" ? "active" : "") + '" onclick="switchAdminTab(\'game\')">Game</button>' +
    '<button class="tab-btn ' + (tab === "teams" ? "active" : "") + '" onclick="switchAdminTab(\'teams\')">Teams</button>' +
    '<button class="tab-btn ' + (tab === "matches" ? "active" : "") + '" onclick="switchAdminTab(\'matches\')">Matches</button>' +
    '<button class="tab-btn ' + (tab === "ratings" ? "active" : "") + '" onclick="switchAdminTab(\'ratings\')">Ratings</button>' +
    '</div><div id="admin-tab-content"></div>';
  el.innerHTML = html;

  if (tab === "game") renderAdminGame();
  else if (tab === "teams") renderAdminTeams();
  else if (tab === "matches") renderAdminMatches();
  else if (tab === "ratings") renderAdminRatings();
}

function switchAdminTab(tab) {
  state.adminTab = tab;
  renderAdminTabs();
}

// --- Admin: Game ---
function renderAdminGame() {

    '<div class="card-title">Create game</div><div style="height:12px"></div>' +

    '<input class="form-input" type="date" id="game-date"></div>' +
    '<div class="form-group"><label class="form-label">Time</label>' +
    '<input class="form-input" type="time" id="game-time" value="19:00"></div>' +
    '<div class="form-group"><label class="form-label">Location</label>' +
    '<input class="form-input" id="game-location" placeholder="Field name"></div>' +
    '<button class="btn btn-primary" onclick="doCreateGame()">Create game</button></div>';

  api("/game").then(function(data) {
    if (data.game) {
      state.activeGame = data.game;
      html += '<div class="card"><div class="card-header"><div class="card-title">Active: ' +
        data.game.date + '</div><span class="game-status active">Active</span></div>' +
        '<div style="font-size:13px;color:var(--hint)">' + data.game.time + ' &middot; ' + data.game.location + '</div>' +
        '<div style="margin-top:12px"><button class="btn btn-danger" onclick="doCloseGame()">Close game</button></div></div>';

      '<div class="form-group"><label class="form-label">Rating</label>' +
      '<div class="rating-edit"><input type="range" min="1" max="10" step="0.5" value="5" id="guest-rating" ' +
      'oninput="document.getElementById(\'guest-rating-val\').textContent=parseFloat(this.value).toFixed(1)">' +

}

function doCreateGame() {
  var date = document.getElementById("game-date").value;
  var time = document.getElementById("game-time").value;
  var location = document.getElementById("game-location").value;
  if (!date || !location) return;
  api("/game", "POST", { date: date, time: time, location: location }).then(function() {
    renderAdminGame();
  }).catch(function(e) {});
}

function doCloseGame() {
  api("/game/close", "POST").then(function() {
    state.activeGame = null;
    renderAdminGame();
  }).catch(function(e) {});
}

function doAddGuest() {
  var name = document.getElementById("guest-name").value;
  var rating = parseFloat(document.getElementById("guest-rating").value);
  if (!name) return;
  api("/guest", "POST", { name: name, rating: rating }).then(function() {
    document.getElementById("guest-name").value = "";
    api("/players").then(function(data) { state.allPlayers = data.players; });
  }).catch(function(e) {});
}

// --- Admin: Teams ---
var teamAssignment = {};
var selectedTeamNum = 1;
var numTeams = 3;
var teamsLoaded = false;
var teamsGameId = null;

function renderAdminTeams() {
  var el = document.getElementById("admin-tab-content");

  api("/game").then(function(data) {
    if (!data.game) {
      el.innerHTML = '<div class="empty-state"><p>No active game. Create one first.</p></div>';
      return;
    }
    state.activeGame = data.game;

    if (!teamsLoaded || teamsGameId !== data.game.id) {
      teamsGameId = data.game.id;
      teamAssignment = {};
      var existingTeams = data.teams;
      var teamKeys = Object.keys(existingTeams);
      if (teamKeys.length > 0) {
        numTeams = teamKeys.length;
        for (var k = 0; k < teamKeys.length; k++) {
          var tn = parseInt(teamKeys[k]);
          teamAssignment[tn] = [];
          var ps = existingTeams[teamKeys[k]];
          for (var p = 0; p < ps.length; p++) {
            teamAssignment[tn].push(ps[p].id);
          }
        }
      } else {
        for (var t = 1; t <= numTeams; t++) {
          teamAssignment[t] = [];
        }
      }
      teamsLoaded = true;
    }

    drawTeamsUI(el, data.game);
  });
}

function drawTeamsUI(el, game) {
    var html = '<div class="card">' +
      '<div class="card-title">Teams for ' + game.date + '</div><div style="height:10px"></div>';

    // Num teams selector
    html += '<div class="form-group"><label class="form-label">Number of teams</label>' +
      '<div class="chip-row">';
    for (var n = 2; n <= 4; n++) {
      html += '<button class="chip ' + (numTeams === n ? "active" : "") + '" onclick="setNumTeams(' + n + ')">' + n + ' teams</button>';
    }
    html += '</div></div>';

    // Select which team to add players to
    html += '<div class="form-group"><label class="form-label">Add to team</label><div class="chip-row">';
    for (var t = 1; t <= numTeams; t++) {
      var tName = getTeamNameFromIds(t);
      html += '<button class="chip ' + (selectedTeamNum === t ? "active" : "") + '" onclick="selectTeamNum(' + t + ')">' +
        '<span class="team-color ' + teamColorClass(t) + '"></span>' + tName + '</button>';
    }
    html += '</div></div>';

    // Current teams display
    for (var t = 1; t <= numTeams; t++) {
      var ids = teamAssignment[t] || [];
      var tName = getTeamNameFromIds(t);
      html += '<div style="margin-top:10px;padding:10px;border-left:3px solid ' + getTeamColor(t) + ';background:rgba(255,255,255,0.02);border-radius:8px">' +
        '<div style="font-size:14px;font-weight:600;margin-bottom:6px"><span class="team-color ' + teamColorClass(t) + '"></span>' + tName + ' (' + ids.length + ')</div>';
      for (var p = 0; p < ids.length; p++) {
        var pl = findPlayer(ids[p]);
        if (pl) {
          html += '<div style="display:flex;align-items:center;gap:8px;padding:4px 0">' +
            '<span style="font-size:13px">' + playerName(pl) + ' (' + pl.rating.toFixed(1) + ')</span>' +
            '<button class="del-btn" onclick="removeFromTeam(' + t + ',' + pl.id + ')">x</button></div>';
        }
      }
      html += '</div>';
    }

    html += '<div style="margin-top:14px"><button class="btn btn-primary" onclick="doSaveTeams()">Save teams</button></div></div>';

    // Available players
    var selName = getTeamNameFromIds(selectedTeamNum);
    html += '<div class="card"><div class="card-title">Add players to ' + selName + '</div><div style="height:8px"></div>';
    var available = getUnassignedPlayers();
    if (available.length === 0) {
      html += '<div style="font-size:13px;color:var(--hint)">All players assigned.</div>';
    }
    for (var i = 0; i < available.length; i++) {
      var pl = available[i];
      var color = avatarColor(playerName(pl));
      html += '<button class="player-select-btn" onclick="addToTeam(' + selectedTeamNum + ',' + pl.id + ')">' +
        '<span class="avatar-sm" style="background:' + color + '22;color:' + color + '">' + initials(pl) + '</span>' +
        playerName(pl) + ' <span style="color:var(--hint);margin-left:auto">' + pl.rating.toFixed(1) + '</span></button>';
    }
    html += '</div>';

    el.innerHTML = html;
}

function findPlayer(id) {
  for (var i = 0; i < state.allPlayers.length; i++) {
    if (state.allPlayers[i].id === id) return state.allPlayers[i];
  }
  return null;
}

function getUnassignedPlayers() {
  var assigned = {};
  var keys = Object.keys(teamAssignment);
  for (var k = 0; k < keys.length; k++) {
    var ids = teamAssignment[keys[k]];
    for (var i = 0; i < ids.length; i++) assigned[ids[i]] = true;
  }
  var result = [];
  for (var i = 0; i < state.allPlayers.length; i++) {
    if (!assigned[state.allPlayers[i].id]) result.push(state.allPlayers[i]);
  }
  return result;
}

function redrawTeams() {
  var el = document.getElementById("admin-tab-content");
  if (state.activeGame) drawTeamsUI(el, state.activeGame);
}

function setNumTeams(n) {
  numTeams = n;
  var keys = Object.keys(teamAssignment);
  for (var k = 0; k < keys.length; k++) {
    if (parseInt(keys[k]) > n) delete teamAssignment[keys[k]];
  }
  for (var t = 1; t <= n; t++) {
    if (!teamAssignment[t]) teamAssignment[t] = [];
  }
  if (selectedTeamNum > n) selectedTeamNum = n;
  redrawTeams();
}

function selectTeamNum(t) {
  selectedTeamNum = t;
  redrawTeams();
}

function addToTeam(team, playerId) {
  if (!teamAssignment[team]) teamAssignment[team] = [];
  teamAssignment[team].push(playerId);
  redrawTeams();
}

function removeFromTeam(team, playerId) {
  if (!teamAssignment[team]) return;
  var idx = teamAssignment[team].indexOf(playerId);
  if (idx >= 0) teamAssignment[team].splice(idx, 1);
  redrawTeams();
}

function doSaveTeams() {
  if (!state.activeGame) return;
  api("/teams/" + state.activeGame.id, "POST", { teams: teamAssignment }).then(function() {
    teamsLoaded = false;
  }).catch(function(e) {});
}

// --- Admin: Matches ---
function renderAdminMatches() {
  var el = document.getElementById("admin-tab-content");
  api("/game").then(function(data) {
    if (!data.game) {
      el.innerHTML = '<div class="empty-state"><p>No active game.</p></div>';
      return;
    }
    state.activeGame = data.game;
    var gameId = data.game.id;
    var teams = data.teams;
    var matches = data.matches;
    var goals = data.goals;
    var teamNums = Object.keys(teams).sort();
    var tNames = buildTeamNames(teams);

    if (teamNums.length < 2) {
      el.innerHTML = '<div class="empty-state"><p>Set up teams first.</p></div>';
      return;
    }

    var html = '';

    // Create match
    html += '<div class="card"><div class="card-title">Record match</div><div style="height:10px"></div>' +
      '<div class="form-group"><label class="form-label">Team A</label>' +
      '<select class="form-input" id="match-team-a">';
    for (var i = 0; i < teamNums.length; i++) {
      html += '<option value="' + teamNums[i] + '">' + tNames[teamNums[i]] + '</option>';
    }
    html += '</select></div>' +
      '<div class="form-group"><label class="form-label">Team B</label>' +
      '<select class="form-input" id="match-team-b">';
    for (var i = 0; i < teamNums.length; i++) {
      var sel = i === 1 ? " selected" : "";
      html += '<option value="' + teamNums[i] + '"' + sel + '>' + tNames[teamNums[i]] + '</option>';
    }
    html += '</select></div>' +
      '<div class="form-group"><label class="form-label">Result</label>' +
      '<select class="form-input" id="match-result">' +
      '<option value="team_a">Team A won</option>' +
      '<option value="team_b">Team B won</option>' +
      '<option value="draw">Draw</option>' +
      '</select></div>' +
      '<button class="btn btn-primary" onclick="doCreateMatch()">Save match</button></div>';

    // Existing matches
    if (matches.length > 0) {
      html += '<div class="section-title">Recorded matches</div>';
      for (var m = matches.length - 1; m >= 0; m--) {
        var match = matches[m];
        var nameA = tNames[match.team_a] || "Team " + match.team_a;
        var nameB = tNames[match.team_b] || "Team " + match.team_b;
        var resultText = "?";
        var resultCls = "pending";
        if (match.result === "team_a") { resultText = nameA + " won"; resultCls = "win-a"; }
        else if (match.result === "team_b") { resultText = nameB + " won"; resultCls = "win-b"; }
        else if (match.result === "draw") { resultText = "Draw"; resultCls = "draw"; }

        html += '<div class="match-card"><div class="match-header">' +
          '<div class="match-teams"><span class="team-color ' + teamColorClass(match.team_a) + '"></span>' +
          nameA + ' vs ' + nameB +
          '<span class="team-color ' + teamColorClass(match.team_b) + '" style="margin-left:6px"></span></div>' +
          '<div style="display:flex;align-items:center;gap:6px">' +
          '<span class="match-result ' + resultCls + '">' + resultText + '</span>' +
          '<button class="del-btn" onclick="doDeleteMatch(' + match.id + ')">x</button></div></div>';

        // Edit result
        html += '<div style="margin-top:8px"><select class="form-input" id="edit-match-' + match.id + '" style="font-size:15px;padding:10px 14px">' +
          '<option value="team_a"' + (match.result === "team_a" ? " selected" : "") + '>' + nameA + ' won</option>' +
          '<option value="team_b"' + (match.result === "team_b" ? " selected" : "") + '>' + nameB + ' won</option>' +
          '<option value="draw"' + (match.result === "draw" ? " selected" : "") + '>Draw</option>' +
          '</select> <button class="btn btn-sm btn-secondary" style="display:inline-flex;margin-top:8px" onclick="doEditMatch(' + match.id + ')">Update</button></div>';

        // Goals
        var matchGoals = [];
        for (var gi = 0; gi < goals.length; gi++) {
          if (goals[gi].match_id === match.id) matchGoals.push(goals[gi]);
        }
        if (matchGoals.length > 0) {
          html += '<div class="match-goals" style="margin-top:10px">';
          for (var gi = 0; gi < matchGoals.length; gi++) {
            var goal = matchGoals[gi];
            var scorer = ((goal.scorer_first || "") + " " + (goal.scorer_last && goal.scorer_last !== "(guest)" ? goal.scorer_last : "")).trim();
            var line = '<span style="font-size:18px">&#9917;</span> <span style="font-weight:600;font-size:15px">' + scorer + '</span>';
            if (goal.assist_player_id) {
              var assister = ((goal.assist_first || "") + " " + (goal.assist_last && goal.assist_last !== "(guest)" ? goal.assist_last : "")).trim();
              line += ' <span style="color:var(--hint);font-size:14px">(assist: ' + assister + ')</span>';
            }
            html += '<div class="match-goal-item">' + line + ' <button class="del-btn" onclick="doDeleteGoal(' + goal.id + ')">x</button></div>';
          }
          html += '</div>';
        }

        // Add goal form for this match
        var teamAPlayers = teams[match.team_a] || [];
        var teamBPlayers = teams[match.team_b] || [];
        var allMatchPlayers = teamAPlayers.concat(teamBPlayers);

        html += '<div class="goal-form">' +
          '<div class="goal-form-label">Add goal</div>';

        html += '<select class="form-input" id="goal-scorer-' + match.id + '" style="font-size:16px;padding:12px 14px;margin-bottom:10px">';
        for (var pi = 0; pi < allMatchPlayers.length; pi++) {
          html += '<option value="' + allMatchPlayers[pi].id + '">' + playerName(allMatchPlayers[pi]) + '</option>';
        }
        html += '</select>';

        html += '<select class="form-input" id="goal-assist-' + match.id + '" style="font-size:16px;padding:12px 14px;margin-bottom:10px">' +
          '<option value="">No assist</option>';
        for (var pi = 0; pi < allMatchPlayers.length; pi++) {
          html += '<option value="' + allMatchPlayers[pi].id + '">' + playerName(allMatchPlayers[pi]) + '</option>';
        }
        html += '</select>';

        html += '<button class="btn btn-primary" onclick="doAddGoal(' + match.id + ')" style="margin-top:4px">Add goal</button></div>';
        html += '</div>';
      }
    }

    el.innerHTML = html;
  });
}

function doCreateMatch() {
  if (!state.activeGame) return;
  var teamA = parseInt(document.getElementById("match-team-a").value);
  var teamB = parseInt(document.getElementById("match-team-b").value);
  var result = document.getElementById("match-result").value;
  if (teamA === teamB) return;
  api("/match", "POST", {
    game_id: state.activeGame.id,
    team_a: teamA,
    team_b: teamB,
    result: result
  }).then(function() {
    renderAdminMatches();
  }).catch(function(e) {});
}

function doEditMatch(matchId) {
  var result = document.getElementById("edit-match-" + matchId).value;
  api("/match/" + matchId, "PUT", { result: result }).then(function() {
    renderAdminMatches();
  }).catch(function(e) {});
}

function doDeleteMatch(matchId) {
  if (!confirm("Delete match and its goals?")) return;
  api("/match/" + matchId, "DELETE").then(function() {
    renderAdminMatches();
  }).catch(function(e) {});
}

function doAddGoal(matchId) {
  var scorerId = parseInt(document.getElementById("goal-scorer-" + matchId).value);
  var assistVal = document.getElementById("goal-assist-" + matchId).value;
  var assistId = assistVal ? parseInt(assistVal) : null;
  api("/goal", "POST", {
    match_id: matchId,
    player_id: scorerId,
    assist_player_id: assistId
  }).then(function() {
    renderAdminMatches();
  }).catch(function(e) {});
}

function doDeleteGoal(goalId) {
  api("/goal/" + goalId, "DELETE").then(function() {
    renderAdminMatches();
  }).catch(function(e) {});
}

// --- Admin: Ratings ---
function renderAdminRatings() {
  var el = document.getElementById("admin-tab-content");
  var html = '<div class="card"><div class="card-title">Player ratings</div><div style="height:12px"></div>';
  for (var i = 0; i < state.allPlayers.length; i++) {
    var p = state.allPlayers[i];
    html += '<div class="player-row"><div class="player-info"><div class="player-name">' + playerName(p) + '</div></div>' +
      '<div class="rating-edit"><input type="range" min="1" max="10" step="0.5" value="' + p.rating + '" ' +
      'oninput="this.nextElementSibling.textContent=parseFloat(this.value).toFixed(1)" ' +
      'onchange="doSetRating(' + p.id + ', this.value)">' +
      '<span class="rating-value">' + p.rating.toFixed(1) + '</span></div>' +
      '<button class="del-btn" onclick="doDeletePlayer(' + p.id + ',\'' + playerName(p).replace(/'/g, "\\'") + '\')" title="Delete player">x</button></div>';
  }
  html += '</div>';
  el.innerHTML = html;
}

function doDeletePlayer(playerId, name) {
  if (!confirm("Delete " + name + " and all their stats?")) return;
  api("/player/" + playerId, "DELETE").then(function() {
    state.allPlayers = state.allPlayers.filter(function(p) { return p.id !== playerId; });
    renderAdminRatings();
  }).catch(function(e) {});
}

function doSetRating(playerId, value) {
  api("/rating", "POST", { player_id: playerId, rating: parseFloat(value) }).then(function() {
    for (var i = 0; i < state.allPlayers.length; i++) {
      if (state.allPlayers[i].id === playerId) {
        state.allPlayers[i].rating = parseFloat(value);
        break;
      }
    }
  }).catch(function(e) {});
}

// --- Init ---
loadStats();
</script>
