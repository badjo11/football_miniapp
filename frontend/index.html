<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Football App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #1c2733);
    --text: var(--tg-theme-text-color, #e1e8f0);
    --hint: var(--tg-theme-hint-color, #7a8fa0);
    --link: var(--tg-theme-link-color, #6ab3f3);
    --btn: var(--tg-theme-button-color, #3a95d5);
    --btn-text: var(--tg-theme-button-text-color, #fff);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #17212b);
    --section-bg: var(--tg-theme-section-bg-color, #232e3c);
    --accent: #4cc474;
    --warn: #f5c542;
    --danger: #e06c75;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 72px;
    -webkit-font-smoothing: antialiased;
  }

  /* ─── Nav ──────────────────────────── */
  .nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--secondary-bg);
    border-top: 1px solid rgba(255,255,255,0.06);
    display: flex; z-index: 100;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; gap: 2px;
    padding: 8px 0; font-size: 11px; color: var(--hint);
    cursor: pointer; transition: color 0.15s;
    border: none; background: none;
  }
  .nav-item.active { color: var(--link); }
  .nav-item svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ─── Screens ──────────────────────── */
  .screen { display: none; padding: 16px; animation: fadeIn 0.2s ease; }
  .screen.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; } }

  /* ─── Cards ────────────────────────── */
  .card {
    background: var(--section-bg);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .card-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .card-title { font-size: 16px; font-weight: 600; }
  .badge {
    font-size: 11px; font-weight: 600;
    padding: 3px 8px; border-radius: 10px;
  }
  .badge-s { background: rgba(245,197,66,0.15); color: var(--warn); }
  .badge-a { background: rgba(76,196,116,0.15); color: var(--accent); }
  .badge-b { background: rgba(106,179,243,0.15); color: var(--link); }
  .badge-c { background: rgba(255,255,255,0.08); color: var(--hint); }

  /* ─── Player List ──────────────────── */
  .player-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .player-row:last-child { border-bottom: none; }
  .player-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 13px; flex-shrink: 0;
  }
  .player-info { flex: 1; min-width: 0; }
  .player-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-username { font-size: 12px; color: var(--hint); }
  .player-rating { font-size: 15px; font-weight: 600; text-align: right; min-width: 32px; }

  /* ─── Buttons ──────────────────────── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 12px 20px; border-radius: 12px;
    font-size: 15px; font-weight: 600;
    border: none; cursor: pointer;
    width: 100%; transition: transform 0.1s, opacity 0.15s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--btn); color: var(--btn-text); }
  .btn-danger { background: rgba(224,108,117,0.15); color: var(--danger); }
  .btn-secondary { background: rgba(255,255,255,0.06); color: var(--text); }
  .btn:disabled { opacity: 0.4; pointer-events: none; }
  .btn-row { display: flex; gap: 8px; margin-top: 12px; }
  .btn-row .btn { flex: 1; }

  /* ─── Game Banner ──────────────────── */
  .game-banner {
    background: linear-gradient(135deg, rgba(58,149,213,0.2), rgba(76,196,116,0.12));
    border-radius: 16px; padding: 20px; margin-bottom: 12px;
    border: 1px solid rgba(58,149,213,0.15);
  }
  .game-banner h2 { font-size: 20px; margin-bottom: 6px; }
  .game-meta { font-size: 13px; color: var(--hint); line-height: 1.6; }
  .game-meta span { margin-right: 12px; }
  .progress-bar {
    height: 4px; background: rgba(255,255,255,0.08);
    border-radius: 2px; margin: 14px 0 8px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; border-radius: 2px; transition: width 0.4s ease;
    background: var(--accent);
  }
  .count-label { font-size: 13px; color: var(--hint); text-align: right; }

  /* ─── Teams ────────────────────────── */
  .team-card {
    background: var(--section-bg);
    border-radius: 14px; padding: 16px; margin-bottom: 12px;
    border-left: 3px solid var(--link);
  }
  .team-card:nth-child(2) { border-left-color: var(--accent); }
  .team-card:nth-child(3) { border-left-color: var(--warn); }
  .team-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .team-name { font-size: 16px; font-weight: 600; }
  .team-rating { font-size: 13px; color: var(--hint); }

  /* ─── Section Titles ───────────────── */
  .section-title {
    font-size: 13px; font-weight: 600; color: var(--hint);
    text-transform: uppercase; letter-spacing: 0.5px;
    margin: 20px 0 10px; padding-left: 4px;
  }

  /* ─── Empty State ──────────────────── */
  .empty-state {
    text-align: center; padding: 60px 20px; color: var(--hint);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; line-height: 1.5; }

  /* ─── Admin Forms ──────────────────── */
  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 13px; color: var(--hint); margin-bottom: 6px; display: block; }
  .form-input {
    width: 100%; padding: 10px 14px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; color: var(--text);
    font-size: 15px; outline: none;
    transition: border-color 0.15s;
  }
  .form-input:focus { border-color: var(--link); }
  select.form-input { -webkit-appearance: none; }

  /* ─── Rating Stars ─────────────────── */
  .rating-edit {
    display: flex; align-items: center; gap: 8px;
  }
  .rating-edit input[type="range"] {
    flex: 1; accent-color: var(--btn);
  }
  .rating-value {
    font-size: 16px; font-weight: 600;
    min-width: 36px; text-align: center;
  }

  /* ─── Partner Select ───────────────── */
  .partner-btn {
    background: none; border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; padding: 8px 12px; color: var(--text);
    cursor: pointer; width: 100%; text-align: left;
    display: flex; align-items: center; gap: 10px;
    transition: background 0.15s;
  }
  .partner-btn:hover { background: rgba(255,255,255,0.04); }
  .partner-btn.selected { border-color: var(--accent); background: rgba(76,196,116,0.08); }

  /* ─── Toast ────────────────────────── */
  .toast {
    position: fixed; top: 16px; left: 16px; right: 16px;
    background: var(--section-bg); border-radius: 12px;
    padding: 14px 16px; font-size: 14px; font-weight: 500;
    z-index: 200; transform: translateY(-100px); opacity: 0;
    transition: all 0.3s ease; text-align: center;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .toast.show { transform: translateY(0); opacity: 1; }

  /* ─── Loading ──────────────────────── */
  .loading { text-align: center; padding: 40px; color: var(--hint); }
  .spinner {
    width: 28px; height: 28px; border: 2px solid rgba(255,255,255,0.1);
    border-top-color: var(--link); border-radius: 50%;
    animation: spin 0.6s linear infinite; margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="toast" class="toast"></div>

<!-- ═══ HOME ══════════════════════════════════ -->
<div id="screen-home" class="screen active">
  <div id="home-content"><div class="loading"><div class="spinner"></div>Загрузка...</div></div>
</div>

<!-- ═══ ROSTER ════════════════════════════════ -->
<div id="screen-roster" class="screen">
  <div id="roster-content"><div class="loading"><div class="spinner"></div></div></div>
</div>

<!-- ═══ TEAMS ═════════════════════════════════ -->
<div id="screen-teams" class="screen">
  <div id="teams-content"><div class="loading"><div class="spinner"></div></div></div>
</div>

<!-- ═══ PLAYERS ═══════════════════════════════ -->
<div id="screen-players" class="screen">
  <div class="section-title">Все игроки</div>
  <div id="players-content"><div class="loading"><div class="spinner"></div></div></div>
</div>

<!-- ═══ ADMIN ═════════════════════════════════ -->
<div id="screen-admin" class="screen">
  <div class="section-title">Администрирование</div>
  <div id="admin-content"></div>
</div>

<!-- ═══ NAV ═══════════════════════════════════ -->
<nav class="nav">
  <button class="nav-item active" onclick="showScreen('home')">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Игра
  </button>
  <button class="nav-item" onclick="showScreen('roster')">
    <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
    Состав
  </button>
  <button class="nav-item" onclick="showScreen('teams')">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="9" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    Команды
  </button>
  <button class="nav-item" onclick="showScreen('players')">
    <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    Рейтинг
  </button>
  <button class="nav-item" id="nav-admin" style="display:none" onclick="showScreen('admin')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9c.26.6.77 1.05 1.39 1.17H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    Админ
  </button>
</nav>

<script>
const tg = window.Telegram?.WebApp;
const initData = tg?.initData || "";

// Telegram WebApp: расширяемся на весь экран
if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor("secondary_bg_color");
}

let state = {
  player: null,
  game: null,
  isAdmin: false,
};

// ─── API ─────────────────────────────────────────

async function api(path, method = "GET", body = null) {
  const opts = {
    method,
    headers: {
      "Content-Type": "application/json",
      "X-Telegram-Init-Data": initData,
    },
  };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(`/api${path}`, opts);
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.detail || `Error ${res.status}`);
  }
  return res.json();
}

// ─── Navigation ──────────────────────────────────

function showScreen(name) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
  document.getElementById(`screen-${name}`).classList.add("active");
  const navItems = document.querySelectorAll(".nav-item");
  const idx = { home:0, roster:1, teams:2, players:3, admin:4 }[name];
  if (navItems[idx]) navItems[idx].classList.add("active");

  const loaders = { home: loadHome, roster: loadRoster, teams: loadTeams, players: loadPlayers, admin: loadAdmin };
  if (loaders[name]) loaders[name]();
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2500);
}

// ─── Helpers ─────────────────────────────────────

function ratingClass(r) {
  if (r >= 9) return "s";
  if (r >= 7) return "a";
  if (r >= 5) return "b";
  return "c";
}

function ratingLabel(r) {
  const cls = ratingClass(r);
  return { s: "S", a: "A", b: "B", c: "C" }[cls];
}

function avatarColor(name) {
  const colors = [
    "#e06c75","#d19a66","#e5c07b","#98c379","#56b6c2","#61afef","#c678dd",
  ];
  let h = 0;
  for (let i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
  return colors[Math.abs(h) % colors.length];
}

function initials(p) {
  const f = p.first_name || "";
  const l = p.last_name || "";
  return (f[0] || "") + (l[0] || "") || "?";
}

function playerName(p) {
  return [p.first_name, p.last_name].filter(Boolean).join(" ") || p.username || "Игрок";
}

function playerRow(p, extra = "") {
  const name = playerName(p);
  const cls = ratingClass(p.rating);
  const color = avatarColor(name);
  return `
    <div class="player-row">
      <div class="player-avatar" style="background:${color}22;color:${color}">${initials(p)}</div>
      <div class="player-info">
        <div class="player-name">${name}</div>
        <div class="player-username">${p.username ? "@" + p.username : ""}</div>
      </div>
      <span class="badge badge-${cls}">${ratingLabel(p.rating)}</span>
      <div class="player-rating">${p.rating.toFixed(1)}</div>
      ${extra}
    </div>
  `;
}

// ─── HOME ────────────────────────────────────────

async function loadHome() {
  const el = document.getElementById("home-content");
  try {
    const data = await api("/me");
    state.player = data.player;
    state.isAdmin = data.player.is_admin;

    if (state.isAdmin) {
      document.getElementById("nav-admin").style.display = "";
    }

    const game = data.active_game;
    if (!game) {
      el.innerHTML = `
        <div class="empty-state">
          <div class="icon">⚽</div>
          <p>Нет активной игры.<br>Ждите объявления от администратора.</p>
        </div>
      `;
      return;
    }

    const gameData = await api("/game");
    state.game = gameData.game;
    const pct = Math.round((gameData.count / game.max_players) * 100);
    const isReg = gameData.is_registered;

    el.innerHTML = `
      <div class="game-banner">
        <h2>⚽ ${game.date}</h2>
        <div class="game-meta">
          <span>🕐 ${game.time}</span>
          <span>📍 ${game.location}</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="count-label">${gameData.count} / ${game.max_players} игроков</div>
        <div class="btn-row">
          ${isReg
            ? `<button class="btn btn-danger" onclick="doUnregister()">Отписаться</button>`
            : `<button class="btn btn-primary" onclick="doRegister()" ${gameData.count >= game.max_players ? "disabled" : ""}>
                ${gameData.count >= game.max_players ? "Мест нет" : "Записаться"}
              </button>`
          }
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">Мой профиль</div>
          <span class="badge badge-${ratingClass(state.player.rating)}">${ratingLabel(state.player.rating)}-класс</span>
        </div>
        ${playerRow(state.player)}
        <div class="section-title" style="margin-top:16px">Партнёр по команде</div>
        <div id="partner-section"></div>
      </div>
    `;

    loadPartnerSection(gameData.players);
  } catch (e) {
    el.innerHTML = `<div class="empty-state"><p>Ошибка загрузки: ${e.message}</p></div>`;
  }
}

function loadPartnerSection(players) {
  const el = document.getElementById("partner-section");
  if (!el) return;

  const me = state.player;
  const others = players.filter(p => p.id !== me.id);

  api("/me").then(data => {
    const pref = data.preference;
    let html = "";
    if (pref) {
      html += `
        <div class="player-row">
          <div class="player-avatar" style="background:${avatarColor(playerName(pref))}22;color:${avatarColor(playerName(pref))}">${initials(pref)}</div>
          <div class="player-info">
            <div class="player-name">${playerName(pref)}</div>
            <div class="player-username" style="color:var(--accent)">✓ Выбран партнёром</div>
          </div>
          <button class="btn btn-danger" style="width:auto;padding:6px 12px;font-size:12px" onclick="doClearPartner()">✕</button>
        </div>
      `;
    } else if (others.length > 0) {
      html += `<div style="font-size:13px;color:var(--hint);margin-bottom:8px">Выбери, с кем хочешь быть в одной команде:</div>`;
      others.forEach(p => {
        html += `
          <button class="partner-btn" onclick="doSetPartner(${p.id})">
            <div class="player-avatar" style="width:28px;height:28px;font-size:11px;background:${avatarColor(playerName(p))}22;color:${avatarColor(playerName(p))}">${initials(p)}</div>
            <span>${playerName(p)} (${p.rating.toFixed(1)})</span>
          </button>
          <div style="height:6px"></div>
        `;
      });
    } else {
      html += `<div style="font-size:13px;color:var(--hint)">Пока никто не записался.</div>`;
    }
    el.innerHTML = html;
  });
}

async function doRegister() {
  try {
    await api("/register", "POST");
    toast("✅ Ты записан!");
    loadHome();
  } catch (e) { toast("❌ " + e.message); }
}

async function doUnregister() {
  try {
    await api("/unregister", "POST");
    toast("👌 Ты отписался");
    loadHome();
  } catch (e) { toast("❌ " + e.message); }
}

async function doSetPartner(partnerId) {
  try {
    await api("/preference", "POST", { partner_id: partnerId });
    toast("✅ Партнёр выбран!");
    loadHome();
  } catch (e) { toast("❌ " + e.message); }
}

async function doClearPartner() {
  try {
    await api("/preference", "DELETE");
    toast("Партнёр убран");
    loadHome();
  } catch (e) { toast("❌ " + e.message); }
}

// ─── ROSTER ──────────────────────────────────────

async function loadRoster() {
  const el = document.getElementById("roster-content");
  try {
    const data = await api("/game");
    if (!data.game) {
      el.innerHTML = `<div class="empty-state"><div class="icon">📋</div><p>Нет активной игры.</p></div>`;
      return;
    }

    const groups = { s: [], a: [], b: [], c: [] };
    data.players.forEach(p => groups[ratingClass(p.rating)].push(p));

    let html = `
      <div class="card">
        <div class="card-header">
          <div class="card-title">${data.game.date} · ${data.game.time}</div>
          <span style="font-size:14px;font-weight:600;color:var(--accent)">${data.count}/${data.game.max_players}</span>
        </div>
    `;

    const labels = { s:"⭐ S-класс", a:"🟢 A-класс", b:"🔵 B-класс", c:"⚪ C-класс" };
    for (const [cls, label] of Object.entries(labels)) {
      if (groups[cls].length > 0) {
        html += `<div class="section-title">${label} (${groups[cls].length})</div>`;
        groups[cls].forEach(p => html += playerRow(p));
      }
    }

    html += `</div>`;
    el.innerHTML = html;
  } catch (e) {
    el.innerHTML = `<div class="empty-state"><p>${e.message}</p></div>`;
  }
}

// ─── TEAMS ───────────────────────────────────────

async function loadTeams() {
  const el = document.getElementById("teams-content");
  try {
    const data = await api("/teams");
    if (!data.teams || Object.keys(data.teams).length === 0) {
      el.innerHTML = `<div class="empty-state"><div class="icon">⚽</div><p>Составы ещё не сформированы.</p></div>`;
      return;
    }

    let html = "";
    const teamNames = ["", "Команда 1", "Команда 2", "Команда 3", "Команда 4"];
    for (const [tn, team] of Object.entries(data.teams)) {
      html += `
        <div class="team-card">
          <div class="team-header">
            <div class="team-name">🏆 ${teamNames[tn] || "Команда " + tn}</div>
            <div class="team-rating">Σ ${team.total_rating} · ø ${team.avg_rating}</div>
          </div>
          ${team.players.map(p => playerRow(p)).join("")}
        </div>
      `;
    }
    el.innerHTML = html;
  } catch (e) {
    el.innerHTML = `<div class="empty-state"><p>${e.message}</p></div>`;
  }
}

// ─── PLAYERS ─────────────────────────────────────

async function loadPlayers() {
  const el = document.getElementById("players-content");
  try {
    const data = await api("/players");
    if (data.players.length === 0) {
      el.innerHTML = `<div class="empty-state"><p>Нет зарегистрированных игроков.</p></div>`;
      return;
    }
    el.innerHTML = `<div class="card">${data.players.map(p => playerRow(p)).join("")}</div>`;
  } catch (e) {
    el.innerHTML = `<div class="empty-state"><p>${e.message}</p></div>`;
  }
}

// ─── ADMIN ───────────────────────────────────────

async function loadAdmin() {
  const el = document.getElementById("admin-content");
  if (!state.isAdmin) {
    el.innerHTML = `<div class="empty-state"><p>Нет доступа.</p></div>`;
    return;
  }

  const playersData = await api("/players");
  const players = playersData.players;

  el.innerHTML = `
    <div class="card">
      <div class="card-title">Создать игру</div>
      <div style="height:12px"></div>
      <div class="form-group">
        <label class="form-label">Дата</label>
        <input class="form-input" type="date" id="game-date">
      </div>
      <div class="form-group">
        <label class="form-label">Время</label>
        <input class="form-input" type="time" id="game-time" value="19:00">
      </div>
      <div class="form-group">
        <label class="form-label">Место</label>
        <input class="form-input" id="game-location" placeholder="Поле на Манаса">
      </div>
      <div class="form-group">
        <label class="form-label">Мест</label>
        <input class="form-input" type="number" id="game-max" value="20" min="4" max="40">
      </div>
      <button class="btn btn-primary" onclick="doCreateGame()">Создать игру</button>
    </div>

    <div class="card">
      <div class="card-title">Распределить составы</div>
      <div style="height:12px"></div>
      <button class="btn btn-primary" onclick="doDistribute()">⚙️ Авто-распределение</button>
    </div>

    <div class="card">
      <div class="card-title">Закрыть запись</div>
      <div style="height:12px"></div>
      <button class="btn btn-danger" onclick="doCloseGame()">Закрыть текущую игру</button>
    </div>

    <div class="card">
      <div class="card-title">Рейтинги игроков</div>
      <div style="height:12px"></div>
      <div id="admin-ratings">
        ${players.map(p => `
          <div class="player-row">
            <div class="player-info">
              <div class="player-name">${playerName(p)}</div>
            </div>
            <div class="rating-edit">
              <input type="range" min="1" max="10" step="0.5" value="${p.rating}"
                     oninput="this.nextElementSibling.textContent=parseFloat(this.value).toFixed(1)"
                     onchange="doSetRating(${p.id}, this.value)">
              <span class="rating-value">${p.rating.toFixed(1)}</span>
            </div>
          </div>
        `).join("")}
      </div>
    </div>
  `;
}

async function doCreateGame() {
  const date = document.getElementById("game-date").value;
  const time = document.getElementById("game-time").value;
  const location = document.getElementById("game-location").value;
  const max = parseInt(document.getElementById("game-max").value);
  if (!date || !location) { toast("Заполните дату и место"); return; }
  try {
    await api("/game", "POST", { date, time, location, max_players: max });
    toast("✅ Игра создана!");
    loadHome();
  } catch (e) { toast("❌ " + e.message); }
}

async function doDistribute() {
  try {
    const res = await api("/distribute", "POST");
    toast(`✅ Составы готовы! (${Object.keys(res.teams).length} команд)`);
    showScreen("teams");
  } catch (e) { toast("❌ " + e.message); }
}

async function doCloseGame() {
  try {
    await api("/game/close", "POST");
    toast("✅ Запись закрыта");
    loadHome();
  } catch (e) { toast("❌ " + e.message); }
}

async function doSetRating(playerId, value) {
  try {
    await api("/rating", "POST", { player_id: playerId, rating: parseFloat(value) });
  } catch (e) { toast("❌ " + e.message); }
}

// ─── Init ────────────────────────────────────────
loadHome();
</script>
</body>
</html>
